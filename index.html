<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Kamar Rumah Sakit</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f3f4f6;
            --card: #ffffff;
            --text: #1f2937;
            --success: #16a34a;
            --danger: #dc2626;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            background: var(--primary);
            color: white;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .card {
            background: var(--card);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }
        h2 { margin-top: 0; }
        
        /* Tombol & Navigasi */
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #1d4ed8; }
        .btn-secondary { background: #6b7280; }
        .btn-secondary:hover { background: #4b5563; }
        
        /* Form Styles */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .form-group { margin-bottom: 15px; }
        .form-group.full { grid-column: 1 / -1; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            box-sizing: border-box;
        }
        
        /* Map Styles (10 Kamar) */
        .room-map {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
        }
        .room {
            border: 2px solid #d1d5db;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            background: #f9fafb;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .room.occupied {
            border-color: var(--danger);
            background: #fef2f2;
        }
        .room.available {
            border-color: var(--success);
            background: #f0fdf4;
        }
        .room-name { font-weight: bold; font-size: 1.1em; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
        .room-info { font-size: 0.85em; text-align: left; margin-top: 5px; }
        .room-status { font-weight: bold; font-size: 0.9em; margin-top: 5px;}

        /* Table Styles */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
            font-size: 0.9em;
        }
        th { background: #f9fafb; }
        .action-btn {
            padding: 5px 8px;
            font-size: 0.75em;
            margin-right: 3px;
        }
        .edit-btn { background: #eab308; color: black; }
        .delete-btn { background: var(--danger); }

        /* Pengaturan Tampilan Halaman (View Controller) */
        .view-section { display: none; }
        .view-section.active { display: block; }
        
        @media (max-width: 1024px) {
            .room-map { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 768px) {
            .room-map { grid-template-columns: repeat(2, 1fr); }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- ================= HALAMAN 1: LAYAR DEPAN (10 KAMAR) ================= -->
        <div id="viewDenah" class="view-section active">
            <div class="header">
                <h1>Denah Penghuni 10 Kamar Rumah Sakit</h1>
                <button onclick="switchView('form')">+ Input Data Pasien</button>
            </div>
            
            <div class="card">
                <h2>Peta Status Kamar</h2>
                <div class="room-map" id="roomMap">
                    <!-- Rendered by JavaScript -->
                </div>
            </div>
        </div>

        <!-- ================= HALAMAN 2: INPUT & TABEL KONTROL ================= -->
        <div id="viewForm" class="view-section">
            <div class="header">
                <h1 id="formHeaderTitle">Manajemen Data & Input Pasien</h1>
                <button class="btn-secondary" onclick="switchView('denah')">&larr; Kembali ke Denah</button>
            </div>

            <!-- Form Input -->
            <div class="card">
                <h2 id="formTitle">Formulir Input Pasien</h2>
                <form id="patientForm">
                    <input type="hidden" id="patientId">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Nama Pasien</label>
                            <input type="text" id="nama" required>
                        </div>
                        <div class="form-group">
                            <label>Umur (Tahun)</label>
                            <input type="number" id="umur" required>
                        </div>
                        <div class="form-group full">
                            <label>Alamat</label>
                            <textarea id="alamat" rows="2" required></textarea>
                        </div>
                        <div class="form-group">
                            <label>Sakit yang Diderita</label>
                            <input type="text" id="sakit" required>
                        </div>
                        <div class="form-group">
                            <label>Penanganan / Tindakan</label>
                            <input type="text" id="penanganan" required>
                        </div>
                        <div class="form-group">
                            <label>Hari / Tanggal Masuk</label>
                            <input type="date" id="tglMasuk" required>
                        </div>
                        <div class="form-group">
                            <label>Hari / Tanggal Keluar (Estimasi/Aktual)</label>
                            <input type="date" id="tglKeluar" required>
                        </div>
                        <div class="form-group">
                            <label>Dokter Penanggung Jawab</label>
                            <input type="text" id="dokter" required>
                        </div>
                        <div class="form-group">
                            <label>Pilih Kamar</label>
                            <select id="kamar" required>
                                <option value="">-- Pilih Kamar --</option>
                            </select>
                        </div>
                    </div>
                    <div style="margin-top: 15px;">
                        <button type="submit" id="btnSubmit">Simpan Data Pasien</button>
                        <button type="button" class="btn-secondary" id="btnCancel" onclick="resetForm()" style="display:none;">Batal</button>
                    </div>
                </form>
            </div>

            <!-- Tabel Data Inputan -->
            <div class="card">
                <h2>Tabel Daftar Seluruh Pasien</h2>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Kamar</th>
                                <th>Nama Pasien</th>
                                <th>Umur/Alamat</th>
                                <th>Sakit & Penanganan</th>
                                <th>Tgl Masuk - Keluar</th>
                                <th>Dokter</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="patientTableBody">
                            <!-- Rendered by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Inisialisasi Data 10 Kamar
        let patients = JSON.parse(localStorage.getItem('hospital_patients')) || [];
        const roomsList = ["Kamar 101", "Kamar 102", "Kamar 103", "Kamar 104", "Kamar 105", "Kamar 106", "Kamar 107", "Kamar 108", "Kamar 109", "Kamar 110"];

        // Element Referensi
        const form = document.getElementById('patientForm');
        const mapContainer = document.getElementById('roomMap');
        const tableBody = document.getElementById('patientTableBody');
        const kamarSelect = document.getElementById('kamar');

        // Fungsi Ganti Tampilan Halaman (View)
        window.switchView = function(viewName) {
            document.getElementById('viewDenah').classList.remove('active');
            document.getElementById('viewForm').classList.remove('active');
            
            if(viewName === 'denah') {
                document.getElementById('viewDenah').classList.add('active');
                renderMap();
            } else if(viewName === 'form') {
                document.getElementById('viewForm').classList.add('active');
                renderTable();
                updateKamarSelect();
            }
        }

        // Render Peta 10 Kamar di Layar Depan
        function renderMap() {
            mapContainer.innerHTML = '';
            roomsList.forEach(roomName => {
                const occupant = patients.find(p => p.kamar === roomName);
                const isOccupied = !!occupant;
                
                const roomDiv = document.createElement('div');
                roomDiv.className = `room ${isOccupied ? 'occupied' : 'available'}`;
                
                let content = `<div class="room-name">${roomName}</div>`;
                if (isOccupied) {
                    content += `
                        <div class="room-info">
                            <strong>${occupant.nama}</strong><br>
                            Umur: ${occupant.umur} th<br>
                            <small>${occupant.alamat}</small>
                        </div>
                        <div class="room-status" style="color: var(--danger)">Terisi</div>
                    `;
                } else {
                    content += `
                        <div class="room-info" style="color: #6b7280; font-style: italic;">Belum ada penghuni</div>
                        <div class="room-status" style="color: var(--success)">Kosong</div>
                    `;
                }
                
                roomDiv.innerHTML = content;
                mapContainer.appendChild(roomDiv);
            });
        }

        // Update Pilihan Dropdown Kamar (Hanya tampilkan kamar kosong atau yang sedang diedit)
        function updateKamarSelect(currentEditRoom = null) {
            kamarSelect.innerHTML = '<option value="">-- Pilih Kamar --</option>';
            roomsList.forEach(roomName => {
                const isOccupied = patients.some(p => p.kamar === roomName);
                if (!isOccupied || roomName === currentEditRoom) {
                    const option = document.createElement('option');
                    option.value = roomName;
                    option.textContent = roomName;
                    kamarSelect.appendChild(option);
                }
            });
        }

        // Render Tabel di Halaman 2
        function renderTable() {
            tableBody.innerHTML = '';
            const sortedPatients = [...patients].sort((a, b) => a.kamar.localeCompare(b.kamar));
            
            sortedPatients.forEach(p => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${p.kamar}</strong></td>
                    <td>${p.nama}</td>
                    <td>${p.umur} Thn<br><small>${p.alamat}</small></td>
                    <td><b>Sakit:</b> ${p.sakit}<br><b>Tindakan:</b> ${p.penanganan}</td>
                    <td><small>${p.tglMasuk} s/d ${p.tglKeluar}</small></td>
                    <td>${p.dokter}</td>
                    <td>
                        <button class="action-btn edit-btn" onclick="editPatient('${p.id}')">Edit</button>
                        <button class="action-btn delete-btn" onclick="deletePatient('${p.id}')">Hapus</button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        // Handle Submit Form (Tambah & Edit)
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const id = document.getElementById('patientId').value;
            const patientData = {
                id: id ? id : Date.now().toString(),
                nama: document.getElementById('nama').value,
                umur: document.getElementById('umur').value,
                alamat: document.getElementById('alamat').value,
                sakit: document.getElementById('sakit').value,
                penanganan: document.getElementById('penanganan').value,
                tglMasuk: document.getElementById('tglMasuk').value,
                tglKeluar: document.getElementById('tglKeluar').value,
                dokter: document.getElementById('dokter').value,
                kamar: document.getElementById('kamar').value
            };

            if (id) {
                const index = patients.findIndex(p => p.id === id);
                patients[index] = patientData;
                alert('Data pasien berhasil diperbarui!');
            } else {
                patients.push(patientData);
                alert('Pasien berhasil didaftarkan ke kamar!');
            }

            saveData();
            resetForm();
            renderTable(); // Refresh tabel setelah simpan tanpa pindah halaman
        });

        // Fungsi Edit Data
        window.editPatient = function(id) {
            const patient = patients.find(p => p.id === id);
            if (!patient) return;

            document.getElementById('formTitle').innerText = 'Edit Data Pasien';
            document.getElementById('btnSubmit').innerText = 'Update Data';
            document.getElementById('btnCancel').style.display = 'inline-block';
            
            document.getElementById('patientId').value = patient.id;
            document.getElementById('nama').value = patient.nama;
            document.getElementById('umur').value = patient.umur;
            document.getElementById('alamat').value = patient.alamat;
            document.getElementById('sakit').value = patient.sakit;
            document.getElementById('penanganan').value = patient.penanganan;
            document.getElementById('tglMasuk').value = patient.tglMasuk;
            document.getElementById('tglKeluar').value = patient.tglKeluar;
            document.getElementById('dokter').value = patient.dokter;
            
            updateKamarSelect(patient.kamar);
            document.getElementById('kamar').value = patient.kamar;
        };

        // Fungsi Hapus Data
        window.deletePatient = function(id) {
            if (confirm('Apakah Anda yakin ingin menghapus data pasien ini?')) {
                patients = patients.filter(p => p.id !== id);
                saveData();
                renderTable();
                updateKamarSelect();
            }
        };

        // Reset Form
        window.resetForm = function() {
            form.reset();
            document.getElementById('patientId').value = '';
            document.getElementById('formTitle').innerText = 'Formulir Input Pasien';
            document.getElementById('btnSubmit').innerText = 'Simpan Data Pasien';
            document.getElementById('btnCancel').style.display = 'none';
            updateKamarSelect();
        }

        // Simpan Data
        function saveData() {
            localStorage.setItem('hospital_patients', JSON.stringify(patients));
            renderMap();
        }

        // Inisialisasi Pertama
        renderMap();

        // FITUR AUTO-REFRESH UNTUK TV ANDROID (Reload setiap 30 detik)
        setInterval(function() {
            location.reload();
        }, 30000); // 30000 milidetik = 30 detik
    </script>
</body>
</html>
